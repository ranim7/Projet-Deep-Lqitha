# n8n (automation platform) - pinned version, free self-hosted edition.
# The Lqitha tools API and Ollama run on the Windows host; n8n reaches them via host.docker.internal.
services:
  n8n:
    image: n8nio/n8n:2.43.5
    container_name: lqitha-n8n
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false     # lets HTTP nodes read GROQ_API_KEY / LQITHA_API from the environment
      - LQITHA_API=http://host.docker.internal:8000
      - GENERIC_TIMEZONE=Africa/Tunis
      - TZ=Africa/Tunis
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    restart: unless-stopped

volumes:
  n8n_data:
